name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Build static binaries
        run: |
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/plexodus-linux-$arch ./cmd/plexodus
          done
          cp deploy/install.sh deploy/plexodus.service dist/
          (cd dist && sha256sum plexodus-linux-* > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: plexodus-linux
          path: dist/

      # Every push to main refreshes the rolling "latest" release, so the
      # install script always has a stable download URL.
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest && git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Built automatically from main."
          gh release upload latest dist/* --clobber

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
