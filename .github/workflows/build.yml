name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Build static binaries
        run: |
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/plexodus-linux-$arch ./cmd/plexodus
          done
          cp deploy/install.sh deploy/setup.sh deploy/update.sh deploy/store-demo.py deploy/plexodus.service deploy/plexodus-update.service deploy/plexodus-update.timer deploy/plexodus-update.path dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: plexodus-linux
          path: dist/

  # D-pad focus tests for the TV interface (web/e2e), against a mocked API.
  tv-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium

      - name: Typecheck tests
        working-directory: web
        run: npx tsc -p e2e

      - name: Focus tests
        working-directory: web
        run: npx playwright test

      # Screenshots of every screen plus traces for anything that failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-ui-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # With the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets set,
      # every build is signed with the same key and updates install over each
      # other. Without them a one-off key is used and updating means reinstalling.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/plexodus.jks"
            echo "PLEXODUS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret; signing the APK with a one-off key."
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/plexodus.jks" -alias plexodus -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$PW" -keypass "$PW" -dname "CN=Plexodus"
            echo "PLEXODUS_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "PLEXODUS_KEYSTORE=$RUNNER_TEMP/plexodus.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          PLEXODUS_VERSION_CODE: ${{ github.run_number }}
        run: |
          export PLEXODUS_VERSION_NAME="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          # github: the self-updating APK. store: Google Play (AAB) and the
          # Amazon Appstore (APK), without the self-updater.
          gradle --no-daemon assembleGithubRelease assembleStoreRelease bundleStoreRelease
          mkdir -p ../dist
          ls -la app/build/outputs/apk/github/release app/build/outputs/apk/store/release
          # plexodus.apk runs on everything; the per-chip ones are what the
          # app's own updater downloads (a third of the size).
          cp app/build/outputs/apk/github/release/app-github-universal-release.apk ../dist/plexodus.apk
          cp app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk ../dist/plexodus-arm64-v8a.apk
          cp app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk ../dist/plexodus-armeabi-v7a.apk
          cp app/build/outputs/apk/store/release/app-store-universal-release.apk ../dist/plexodus-amazon.apk
          cp app/build/outputs/bundle/storeRelease/app-store-release.aab ../dist/plexodus-play.aab
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: plexodus-android
          path: |
            dist/plexodus.apk
            dist/plexodus-arm64-v8a.apk
            dist/plexodus-armeabi-v7a.apk
            dist/plexodus-amazon.apk
            dist/plexodus-play.aab

  release:
    needs: [server, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Pushes that land close together build in parallel; publish one at a
    # time so an older build can't finish last and replace a newer "latest".
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the release files; the TV test report is uploaded too and is a directory.
          pattern: plexodus-*
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum plexodus-linux-* plexodus*.apk plexodus-play.aab > SHA256SUMS && ls -la)

      # Every push to main refreshes the rolling "latest" release, so the
      # install script and the APK always have a stable download URL.
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer commit is already on main: its own run publishes, and
          # this older build must not overwrite it.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head, this build is $GITHUB_SHA: skipping publish"
            exit 0
          fi
          git tag -f latest && git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Built automatically from main."
          gh release upload latest dist/* --clobber
          # Last, once the APK is up: the app reads this to offer updates
          # (android/app/src/main/java/app/plexodus/Updater.kt).
          mkdir -p meta
          # "abis" lists the smaller per-chip APKs; apps from before they
          # existed ignore it and take the all-in-one "url".
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          entry() { printf '"url":"%s/%s","size":%s,"sha256":"%s"' "$base" "$1" "$(stat -c %s "dist/$1")" "$(sha256sum "dist/$1" | cut -d' ' -f1)"; }
          printf '{"versionCode":%s,"versionName":"%s",%s,"abis":{"arm64-v8a":{%s},"armeabi-v7a":{%s}}}\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_REF_NAME}-${GITHUB_SHA::7}" "$(entry plexodus.apk)" \
            "$(entry plexodus-arm64-v8a.apk)" "$(entry plexodus-armeabi-v7a.apk)" > meta/android-version.json
          python3 -m json.tool meta/android-version.json >/dev/null
          cat meta/android-version.json
          gh release upload latest meta/android-version.json --clobber

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
