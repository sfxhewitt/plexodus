name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Build static binaries
        run: |
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o dist/plexodus-linux-$arch ./cmd/plexodus
          done
          cp deploy/install.sh deploy/plexodus.service dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: plexodus-linux
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # With the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets set,
      # every build is signed with the same key and updates install over each
      # other. Without them a one-off key is used and updating means reinstalling.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/plexodus.jks"
            echo "PLEXODUS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret; signing the APK with a one-off key."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/plexodus.jks" -alias plexodus -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass "$PW" -keypass "$PW" -dname "CN=Plexodus"
            echo "PLEXODUS_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "PLEXODUS_KEYSTORE=$RUNNER_TEMP/plexodus.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          PLEXODUS_VERSION_CODE: ${{ github.run_number }}
        run: |
          export PLEXODUS_VERSION_NAME="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          gradle --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/plexodus.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: plexodus-android
          path: dist/plexodus.apk

  release:
    needs: [server, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum plexodus-linux-* plexodus.apk > SHA256SUMS && ls -la)

      # Every push to main refreshes the rolling "latest" release, so the
      # install script and the APK always have a stable download URL.
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest && git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Built automatically from main."
          gh release upload latest dist/* --clobber

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
